<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Plate</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#10261f;--mute:#667a73;--line:#e1e9e6;--acc:#0f766e;--accs:#d9efeb;--p:#6366f1;--c:#f59e0b;--f:#ec4899;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1411;--card:#15211d;--ink:#eaf4f0;--mute:#8fa39b;--line:#25352f;--acc:#2dd4bf;--accs:#123530;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 16px 140px}
h1{font-size:30px;margin:2px 0;letter-spacing:-.8px}h2{font-size:18px;margin:0 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ib{border:0;background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:20px;font-size:18px;cursor:pointer}.ib:disabled{opacity:.3}
.tabs,.seg{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:16px;margin-bottom:12px;overflow-x:auto}
.tabs button,.seg button{flex:1;border:0;background:none;color:var(--mute);padding:9px 8px;border-radius:12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button.on,.seg button.on{background:var(--accs);color:var(--acc);font-weight:700}.seg small{display:block;font-size:12px;font-weight:400}
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}.nav b{font-size:17px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{display:flex;gap:16px;align-items:center}.ring{position:relative;width:124px;height:124px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:26px}.ring span{font-size:12px;color:var(--mute)}
.macros{flex:1;display:flex;flex-direction:column;gap:10px}.m .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:3px}.m .l b{color:var(--ink)}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.sub{color:var(--mute);font-size:14px;margin:0 0 8px;font-weight:600}
.meal{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}
.meal img,.ph{width:54px;height:54px;border-radius:14px;object-fit:cover;flex:none;background:var(--line)}.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
.meal .t{flex:1;min-width:0}.meal .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meal small,.note{color:var(--mute);font-size:13px}
.meal .k{text-align:right;font-weight:700}.meal .k small{display:block;font-weight:400}.x{border:0;background:none;color:var(--mute);font-size:17px;padding:6px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:22px 8px}.empty big{display:block;font-size:38px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:center;gap:10px;pointer-events:none}.dock button{pointer-events:auto}
.fab{flex:1;max-width:420px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:17px;height:56px;border-radius:28px;cursor:pointer}
@media(prefers-color-scheme:dark){.fab{color:#04211c}}
.alt{width:56px;height:56px;border-radius:28px;border:0;background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{font-size:12px;color:var(--mute);display:block;margin:0 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.row{display:flex;gap:10px}
.chips{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}.chips button{flex:1;border:1px solid var(--line);background:none;color:var(--ink);padding:9px 10px;border-radius:12px;font:inherit;font-size:14px;cursor:pointer}.chips button.on{background:var(--accs);border-color:var(--acc);color:var(--acc);font-weight:700}
.ai{background:var(--accs);color:var(--acc);padding:11px 13px;border-radius:14px;font-size:14px;margin:10px 0}.ai.w{background:rgba(229,72,77,.13);color:var(--bad)}
.btns{display:flex;gap:10px;margin-top:14px}.btns button{flex:1;height:50px;border-radius:25px;border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.pri{background:var(--acc);color:#fff}.pri:disabled{opacity:.4}.sec{background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;z-index:30;max-width:90%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:right}th{font-weight:600;color:var(--mute);border-top:0}td:first-child,th:first-child{text-align:left;color:var(--mute)}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}.lg{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.rw{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}.rw span:first-child{width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw .bar{flex:1}.rw span:last-child{width:70px;text-align:right;color:var(--mute)}
.sheet input[type=checkbox],input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;margin:0}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{background:var(--line);border-radius:20px;animation:pu 1.2s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:5px;z-index:40;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#bar.on{opacity:1}#bar i{display:block;height:100%;width:40%;background:var(--acc);animation:ba 1s ease-in-out infinite}@keyframes ba{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#sync{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;z-index:41;background:var(--acc);color:#fff;padding:9px 16px;border-radius:22px;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translate(-50%,-14px);transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#sync.on{opacity:1;transform:translate(-50%,0)}#sync .spin{border-width:2.5px}
@media(prefers-color-scheme:dark){#sync{color:#04211c}}
.fade{animation:fi .18s ease-out}@keyframes fi{from{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.safe *{animation:none!important;transition:none!important}
button:active{transform:scale(.96)}
.it{border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px}.g4i{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g4i input{padding:9px 6px}.it-t{margin:6px 0 0}
</style></head>
<body><div id="bar"><i></i></div><div id="sync"></div><div id="app"></div><div id="layer"></div><input type="file" id="file" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s);
const BOOT=(()=>{try{const n=(+sessionStorage.getItem('plate-boot')||0)+1;sessionStorage.setItem('plate-boot',n);return n}catch(e){return 1}})();
const SAFE=BOOT>=3; /* page failed to finish starting twice in a row -> safe mode */
if(SAFE){try{localStorage.removeItem('plate-cache');localStorage.removeItem('plate-sum')}catch(e){}document.documentElement.classList.add('safe')}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00'),addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=ymd(new Date()),fmt=n=>Math.round(n||0).toLocaleString();
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const DEFAULT_URL='';/* optional: paste your /exec link between the quotes so nobody has to type it */
let cfg=null;try{cfg=JSON.parse(ls('plate'))}catch(e){}
const H=new URLSearchParams(location.hash.slice(1)),pre={url:H.get('u')||DEFAULT_URL,key:H.get('k')||'',me:H.get('n')||''};
if(pre.url&&pre.key&&pre.me){cfg={url:pre.url,key:pre.key,me:pre.me};ls('plate',JSON.stringify(cfg))}
const keepLink=()=>{if(cfg)try{history.replaceState(null,'','#u='+encodeURIComponent(cfg.url)+'&k='+encodeURIComponent(cfg.key)+'&n='+encodeURIComponent(cfg.me))}catch(e){}};
keepLink();
const S={metric:'k',sums:{},tab:'today',day:TODAY,meals:[],people:{},view:null,ready:false,mode:'week',anchor:TODAY,from:addD(TODAY,-29),to:TODAY,err:''};
const me=()=>cfg&&cfg.me;
try{S.sums=JSON.parse(ls('plate-sum')||'{}')}catch(e){}
try{const c=!SAFE&&cfg&&JSON.parse(ls('plate-cache')||'null');if(c&&c.meals){S.meals=c.meals;S.people=c.people||{};S.view=me();S.ready=true;S.seen=new Set(c.meals.map(m=>m.id))}}catch(e){}
const goals=w=>{const g=S.people[w]||{},k=g.goalKcal||2000;return{k,p:g.goalP||100,c:k*.5/4,f:k*.3/9}};
const ids=()=>{const a=Object.keys(S.people).filter(x=>x!==me());return[me()].concat(a).slice(0,2)};
const toast=t=>{if(/^Couldn’t|^Can’t/.test(t))fb('err');else if(/✓/.test(t))fb('ok');else if(/ logged /.test(t))fb('note');const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)};
async function api(action,data){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),action==='ai'||action==='sum'?90000:30000);
  try{
    const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify(Object.assign({key:cfg.key,action},data||{})),signal:ctl.signal});
    const txt=await r.text();let j;
    try{j=JSON.parse(txt)}catch(e){throw new Error('The backend sent back an error page instead of data. In Apps Script run "authorize", then Deploy → Manage deployments → New version.')}
    if(!j.ok)throw new Error(j.error||'Request failed');return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('Timed out waiting for the backend. Check your internet and try again.');
    if(/Failed to fetch|Load failed|NetworkError/i.test(e.message))throw new Error('Can’t reach the backend – check your connection and the web app URL.');
    throw e;
  }finally{clearTimeout(tm)}
}
function busy(on){
  $('#bar').classList.toggle('on',on);const p=$('#sync');p.classList.toggle('on',on);
  if(on)p.innerHTML='<span class="spin"></span>'+(S.ready?'Updating…':'Loading…');
}
async function load(silent){
  const t0=Date.now();if(!silent)busy(true);
  try{
    const j=await api('list',{who:me(),since:addD(TODAY,-400),thumbSince:addD(TODAY,-14)});
    if(S.seen)j.meals.filter(m=>!S.seen.has(m.id)&&m.who!==me()&&m.ts>Date.now()-864e5).forEach(m=>toast(m.who+' logged '+m.type+': '+m.name+' ('+fmt(m.kcal)+' kcal)'));
    S.seen=new Set(j.meals.map(m=>m.id));
    S.meals=j.meals;S.people={};j.people.forEach(p=>S.people[p.who]=p);
    if(!S.people[me()]){await api('goals',{who:me(),goalKcal:2000,goalP:100,init:true});S.people[me()]={who:me(),goalKcal:2000,goalP:100}}
    if(!S.view)S.view=me();S.ready=true;S.err='';if(!SAFE){ls('plate-cache',JSON.stringify({meals:S.meals.map(m=>m.day>=addD(TODAY,-1)?m:Object.assign({},m,{thumb:''})),people:S.people}));setTimeout(()=>{try{sessionStorage.setItem('plate-boot','0')}catch(e){}},4000)}
  }catch(e){if(S.ready&&!S.warned){S.warned=1;toast('Couldn’t refresh – showing saved data')}if(!S.ready)S.err=e.message}
  if(!silent)setTimeout(()=>busy(false),Math.max(0,1000-(Date.now()-t0)));
  if(!SH&&!$('#layer').innerHTML)render();
}
const tot=(w,d)=>S.meals.filter(m=>m.who===w&&m.day===d).reduce((t,m)=>({k:t.k+m.kcal,p:t.p+m.p,c:t.c+m.c,f:t.f+m.f}),{k:0,p:0,c:0,f:0});
const dayLabel=d=>d===TODAY?'Today':d===addD(TODAY,-1)?'Yesterday':pd(d).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'});

/* ---------- screens ---------- */
function render(f){render0();if(f){const a=$('#app');a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade')}}
function render0(){
  const a=$('#app');
  if(!cfg){a.innerHTML='<h1>Welcome to Plate</h1><p class="note">'+(pre.key?'Almost there – just enter your name.':'Connect once, then you stay signed in.')+'</p><div class="card">'+(DEFAULT_URL?'':'<label>Web app URL</label><input id="s-url" value="'+esc(pre.url)+'" placeholder="https://script.google.com/macros/s/…/exec"><div style="height:10px"></div>')+'<label>Shared passcode</label><input id="s-key" type="password" value="'+esc(pre.key)+'"><div style="height:10px"></div><label>Your name</label><input id="s-me" value="'+esc(pre.me)+'" placeholder="e.g. See"><div class="btns"><button class="pri" data-act="connect">Connect</button></div></div>';return}
  if(S.err){a.innerHTML='<h1>Plate</h1><div class="card empty"><big>🔌</big>'+esc(S.err)+'<div class="btns"><button class="sec" data-act="retry">Try again</button><button class="sec" data-act="reset">Change settings</button></div></div>';return}
  if(!S.ready){a.innerHTML='<h1>Plate</h1><div class="sk" style="height:44px;margin:12px 0"></div><div class="sk" style="height:48px;margin-bottom:12px"></div><div class="sk" style="height:190px;margin-bottom:12px"></div><div class="sk" style="height:230px"></div>';return}
  const seg=ids().map(w=>'<button class="'+(w===S.view?'on':'')+'" data-act="view" data-id="'+esc(w)+'">'+esc(w===me()?'You':w)+(S.tab==='today'?'<small>'+fmt(tot(w,S.day).k)+' kcal</small>':'')+'</button>').join('');
  a.innerHTML='<div class="top"><div><h1>Plate</h1>'+(streak(me())>1?'<div class="note">🔥 '+streak(me())+'-day streak</div>':'')+'</div><button class="ib" data-act="goals" aria-label="Goals and settings">⚙️</button></div>'
   +'<div class="tabs"><button class="'+(S.tab==='today'?'on':'')+'" data-act="tab" data-t="today">Today</button><button class="'+(S.tab==='insights'?'on':'')+'" data-act="tab" data-t="insights">Insights</button></div>'
   +'<div class="seg">'+seg+'</div>'+(ids().length<2?'<div class="card note">👫 Your partner joins by entering the same URL, passcode and their own name.</div>':'')
   +(S.tab==='today'?today():insights())
   +(S.tab==='today'?'<div class="dock"><button class="alt" data-act="manual" aria-label="Describe or type a meal">✏️</button><button class="fab" data-act="snap">📷  Snap a meal</button></div>':'');
}
function today(){
  const v=S.view,g=goals(v),t=tot(v,S.day),own=v===me(),R=52,C=2*Math.PI*R,mk=S.metric,val=t[mk],gl=g[mk],unit=mk==='k'?'kcal':'g',col={k:'var(--acc)',p:'var(--p)',c:'var(--c)',f:'var(--f)'}[mk],over=val>gl;
  const mac=(l,x,y,c)=>'<div class="m"><div class="l"><span>'+l+'</span><b>'+fmt(x)+' / '+fmt(y)+' g</b></div><div class="bar"><i style="width:'+Math.min(100,x/y*100)+'%;background:'+c+'"></i></div></div>';
  const ms=S.meals.filter(m=>m.who===v&&m.day===S.day).sort((a,b)=>a.ts-b.ts);
  const list=ms.length?ms.map(m=>'<div class="meal">'+(m.thumb?'<img alt="" src="'+esc(m.thumb)+'">':'<div class="ph">🍽️</div>')+'<div class="t"'+(own?' data-act="edit" data-id="'+esc(m.id)+'" style="cursor:pointer"':'')+'><b>'+esc(m.name)+'</b><small>'+esc(m.type)+' · '+new Date(m.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</small><br><small>P '+fmt(m.p)+' · C '+fmt(m.c)+' · F '+fmt(m.f)+' g</small></div><div class="k">'+fmt(m.kcal)+'<small>kcal</small></div>'+(own?'<button class="x" aria-label="Edit meal" data-act="edit" data-id="'+esc(m.id)+'">✏️</button><button class="x" aria-label="Delete meal" data-act="del" data-id="'+esc(m.id)+'">🗑️</button>':'')+'</div>').join(''):'<div class="empty"><big>'+(own?'📸':'🍽️')+'</big>'+(own?'Nothing logged yet. Snap your first meal.':esc(v)+' hasn’t logged anything this day.')+'</div>';
  return '<div class="nav"><button class="ib" data-act="prev" aria-label="Previous day">‹</button><b>'+dayLabel(S.day)+'</b><button class="ib" data-act="next" '+(S.day>=TODAY?'disabled':'')+' aria-label="Next day">›</button></div>'
   +'<div class="card"><div class="chips" style="margin:0 0 12px">'+[['k','Calories'],['p','Protein'],['c','Carbs'],['f','Fat']].map(x=>'<button data-act="metric" data-m="'+x[0]+'" class="'+(S.metric===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div><div class="hero"><div class="ring"><svg width="124" height="124" viewBox="0 0 124 124"><circle cx="62" cy="62" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="13"/><circle cx="62" cy="62" r="'+R+'" fill="none" stroke="'+(over?'var(--bad)':col)+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-Math.min(1,val/gl))+'"/></svg><div class="c"><b>'+fmt(val)+'</b><span>'+(over?fmt(val-gl)+' '+unit+' over':fmt(gl-val)+' '+unit+' left')+'</span></div></div><div class="macros">'+mac('Protein',t.p,g.p,'var(--p)')+mac('Carbs',t.c,g.c,'var(--c)')+mac('Fat',t.f,g.f,'var(--f)')+'</div></div></div>'
   +'<div class="card"><p class="sub">Meals'+(own&&ms.length?' <span style="font-weight:400">· tap a meal to edit</span>':'')+'</p>'+list+'</div>'+sumCard(v,S.day,S.day,dayLabel(S.day));
}

/* ---------- insights ---------- */
const MODES=[['day','Day'],['week','Week'],['month','Month'],['quarter','Quarter'],['year','Year'],['custom','Custom']];
function range(){
  const a=S.anchor,d=pd(a),m=S.mode,Y=d.getFullYear(),M=d.getMonth();let f,t;
  if(m==='day')f=t=a;
  else if(m==='week'){f=addD(a,-((d.getDay()+6)%7));t=addD(f,6)}
  else if(m==='month'){f=ymd(new Date(Y,M,1));t=ymd(new Date(Y,M+1,0))}
  else if(m==='quarter'){const q=Math.floor(M/3)*3;f=ymd(new Date(Y,q,1));t=ymd(new Date(Y,q+3,0))}
  else if(m==='year'){f=Y+'-01-01';t=Y+'-12-31'}
  else{f=S.from;t=S.to}
  return[f,t];
}
function rangeLabel(f,t){
  const o={day:'numeric',month:'short'},m=S.mode,d=pd(f);
  if(m==='day')return dayLabel(f);if(m==='month')return d.toLocaleDateString([], {month:'long',year:'numeric'});
  if(m==='quarter')return'Q'+(Math.floor(d.getMonth()/3)+1)+' '+d.getFullYear();if(m==='year')return String(d.getFullYear());
  return pd(f).toLocaleDateString([],o)+' – '+pd(t).toLocaleDateString([],o);
}
function shift(n){
  const d=pd(S.anchor),m=S.mode,Y=d.getFullYear(),M=d.getMonth();
  S.anchor=m==='day'?addD(S.anchor,n):m==='week'?addD(S.anchor,7*n):m==='month'?ymd(new Date(Y,M+n,1)):m==='quarter'?ymd(new Date(Y,M+3*n,1)):ymd(new Date(Y+n,0,1));
}
function stats(w,f,t){
  const ms=S.meals.filter(m=>m.who===w&&m.day>=f&&m.day<=t),by={};
  ms.forEach(m=>{const d=by[m.day]||(by[m.day]={k:0,p:0,c:0,f:0});d.k+=m.kcal;d.p+=m.p;d.c+=m.c;d.f+=m.f});
  const ds=Object.keys(by),n=ds.length,sum=k=>ds.reduce((s,d)=>s+by[d][k],0),g=goals(w).k;
  return{ms,by,n,tk:sum('k'),k:n?sum('k')/n:0,p:n?sum('p')/n:0,c:n?sum('c')/n:0,f:n?sum('f')/n:0,hit:ds.filter(d=>Math.abs(by[d].k-g)<=g*.1).length,max:n?Math.max(...ds.map(d=>by[d].k)):0};
}
function chart(f,t,P){
  const days=Math.round((pd(t)-pd(f))/864e5)+1;let key,lab;
  if(days<=31){key=d=>d;lab=k=>pd(k).getDate()}
  else if(days<=120){key=d=>addD(d,-((pd(d).getDay()+6)%7));lab=k=>pd(k).toLocaleDateString([], {day:'numeric',month:'short'})}
  else{key=d=>d.slice(0,7);lab=k=>pd(k+'-01').toLocaleDateString([], {month:'short'})}
  const ks=[];for(let i=0;i<days;i++){const k=key(addD(f,i));if(ks[ks.length-1]!==k)ks.push(k)}
  const val=(w,k)=>{const by=P[w].by,ds=Object.keys(by).filter(d=>key(d)===k);return ds.length?ds.reduce((s,d)=>s+by[d].k,0)/ds.length:0};
  const ws=Object.keys(P),g=goals(S.view).k,mx=Math.max(g*1.1,...ks.flatMap(k=>ws.map(w=>val(w,k)))),W=460,H=150,gw=W/ks.length,bw=Math.max(2,Math.min(18,gw/ws.length-2)),step=Math.ceil(ks.length/8);
  let s='<svg viewBox="0 0 '+W+' '+(H+22)+'" width="100%" role="img" aria-label="Calories over time">';
  s+='<line x1="0" x2="'+W+'" y1="'+(H-g/mx*H)+'" y2="'+(H-g/mx*H)+'" stroke="var(--mute)" stroke-dasharray="4 4" opacity=".6"/>';
  ks.forEach((k,i)=>ws.forEach((w,j)=>{const h=val(w,k)/mx*H,x=i*gw+(gw-bw*ws.length)/2+j*bw;if(h>0)s+='<rect x="'+x+'" y="'+(H-h)+'" width="'+bw+'" height="'+h+'" rx="'+Math.min(4,bw/2)+'" fill="'+(j?'var(--p)':'var(--acc)')+'"/>'}));
  ks.forEach((k,i)=>{if(i%step===0)s+='<text x="'+(i*gw+gw/2)+'" y="'+(H+16)+'" font-size="11" text-anchor="middle" fill="var(--mute)">'+esc(lab(k))+'</text>'});
  return s+'</svg>';
}

  const kp=sv.p*4,kc=sv.c*4,kf=sv.f*9,kt=kp+kc+kf||1,pc=x=>Math.round(x/kt*100);
  const split='<div class="card"><p class="sub">Where calories come from · '+esc(nm(v))+'</p><div class="bar" style="height:14px"><i style="width:'+kp/kt*100+'%;background:var(--p)"></i><i style="width:'+kc/kt*100+'%;background:var(--c)"></i><i style="width:'+kf/kt*100+'%;background:var(--f)"></i></div><div class="lg"><span><i style="background:var(--p)"></i>Protein '+pc(kp)+'%</span><span><i style="background:var(--c)"></i>Carbs '+pc(kc)+'%</span><span><i style="background:var(--f)"></i>Fat '+pc(kf)+'%</span></div></div>';
  const by={},fd={};sv.ms.forEach(m=>{by[m.type]=(by[m.type]||0)+m.kcal;const k=m.name.trim().toLowerCase(),o=fd[k]||(fd[k]={n:m.name,c:0,k:0});o.c++;o.k+=m.kcal});
  const tk=sv.tk||1,types=['Breakfast','Lunch','Dinner','Snack'].map(x=>'<div class="rw"><span>'+x+'</span><div class="bar"><i style="width:'+(by[x]||0)/tk*100+'%;background:var(--acc)"></i></div><span>'+Math.round((by[x]||0)/tk*100)+'%</span></div>').join('');
  const top=Object.values(fd).sort((a,b)=>b.c-a.c||b.k-a.k).slice(0,5),mc=top.length?top[0].c:1;
  const foods=top.map(o=>'<div class="rw"><span>'+esc(o.n)+'</span><div class="bar"><i style="width:'+o.c/mc*100+'%;background:var(--p)"></i></div><span>'+o.c+'× · '+fmt(o.k/o.c)+'</span></div>').join('');
  return chips+nav+hero+sumCard(v,f,t,rangeLabel(f,t))+ch+cmp+split+'<div class="card"><p class="sub">By meal type</p>'+types+'</div>'+(top.length?'<div class="card"><p class="sub">Most logged meals (times · avg kcal)</p>'+foods+'</div>':'')+'<div class="btns" style="margin-bottom:12px"><button class="sec" data-act="csv">⬇️ Export this period (CSV)</button></div>';
}
function csv(){
  const[f,t]=range(),q=x=>'"'+String(x).replace(/"/g,'""')+'"';
  const rows=S.meals.filter(m=>m.day>=f&&m.day<=t).sort((a,b)=>a.ts-b.ts).map(m=>[m.day,m.who,m.type,q(m.name),m.kcal,m.p,m.c,m.f].join(','));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['Date,Person,Meal type,Meal,kcal,Protein g,Carbs g,Fat g\n'+rows.join('\n')],{type:'text/csv'}));
  a.download='plate-'+f+'-to-'+t+'.csv';document.body.appendChild(a);a.click();a.remove();
}

function streak(w){const has=new Set(S.meals.filter(m=>m.who===w).map(m=>m.day));let d=has.has(TODAY)?TODAY:addD(TODAY,-1),n=0;while(has.has(d)){n++;d=addD(d,-1)}return n}
const sumKey=(w,f,t)=>{const s=stats(w,f,t);return[w,f,t,s.ms.length,Math.round(s.tk)].join('|')};
function sumPayload(w,f,t,label){
  const s=stats(w,f,t),g=goals(w),days=Math.round((pd(t)-pd(f))/864e5)+1,by={},fd={},r=Math.round;
  s.ms.forEach(m=>{by[m.type]=(by[m.type]||0)+m.kcal;const k=m.name.trim().toLowerCase(),o=fd[k]||(fd[k]={name:m.name,times:0});o.times++});
  return{label,who:w,days,daysLogged:s.n,goal:{kcal:g.k,protein:g.p},avgPerDayLogged:{kcal:r(s.k),protein:r(s.p),carbs:r(s.c),fat:r(s.f)},daysWithinTenPercentOfCalorieGoal:s.hit,highestDayKcal:r(s.max),kcalByMealType:by,
    meals:days===1?s.ms.slice(0,12).map(m=>({type:m.type,name:m.name,kcal:m.kcal,p:m.p,c:m.c,f:m.f})):Object.values(fd).sort((a,b)=>b.times-a.times).slice(0,8)};
}
function sumCard(w,f,t,label){
  if(!stats(w,f,t).n)return'';
  const x=S.sums[sumKey(w,f,t)],btn=(txt)=>'<button class="sec" style="width:100%;height:46px;border-radius:23px;border:0;font:inherit;font-weight:700;color:var(--acc);background:var(--accs);cursor:pointer" data-act="sum" data-w="'+esc(w)+'" data-f="'+f+'" data-t="'+t+'" data-l="'+esc(label)+'">'+txt+'</button>';

  else if(x&&x.err)b='<div class="ai w">'+esc(x.err)+'</div>'+btn('Try again');
  else if(x&&x.summary)b='<p style="margin:0 0 10px">'+esc(x.summary)+'</p><ul style="margin:0 0 10px;padding-left:20px">'+(x.tips||[]).map(i=>'<li style="margin-bottom:6px">'+esc(i)+'</li>').join('')+'</ul><p class="note" style="margin:0">General tips from AI, not medical advice.</p>';
  else b=btn('✨ Summary & advice');
  return'<div class="card"><p class="sub">'+(f===t?'Day':'Period')+' summary · '+esc(label)+'</p>'+b+'</div>';
}

async function decode(file){
  try{if(window.createImageBitmap)return await createImageBitmap(file,{resizeWidth:SAFE?640:1000,resizeQuality:'medium'})}catch(e){}
  const url=URL.createObjectURL(file);
  try{return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
function draw(img,max){
  const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;
}

function parseItems(s){try{const a=JSON.parse(s);return Array.isArray(a)&&a.length?a.map(x=>({n:x[0],u:x[1],q:+x[2]||0,k:+x[3]||0,p:+x[4]||0,c:+x[5]||0,f:+x[6]||0})):null}catch(e){return null}}
function itemsStr(){if(!SH.items||!SH.items.length)return'';const s=JSON.stringify(SH.items.map(i=>[i.n,i.u,Math.round(i.q*100)/100,i.k,i.p,i.c,i.f]));return s.length<3000?s:''}

function itemsHTML(){
  return SH.items.map((i,n)=>'<div class="it" data-i="'+n+'"><div class="row" style="gap:8px;align-items:center"><input class="in-n" value="'+esc(i.n)+'" placeholder="Ingredient" aria-label="Ingredient name"><button class="x" data-act="itdel" data-i="'+n+'" aria-label="Remove ingredient">✕</button></div>'
   +'<div class="row" style="gap:8px;align-items:center;margin:6px 0"><button class="ib" style="flex:none;background:var(--bg)" data-act="itq" data-i="'+n+'" data-d="-0.25" aria-label="Less">−</button><input class="in-q" type="number" step="0.05" min="0" inputmode="decimal" value="'+i.q+'" style="width:76px;flex:none;text-align:center" aria-label="Quantity"><button class="ib" style="flex:none;background:var(--bg)" data-act="itq" data-i="'+n+'" data-d="0.25" aria-label="More">+</button><input class="in-u" value="'+esc(i.u)+'" placeholder="per serving, e.g. 1 cup" aria-label="Serving size"></div>'
   +'<div class="g4i">'+[['k','kcal'],['p','Protein'],['c','Carbs'],['f','Fat']].map(([k,l])=>'<div><label>'+l+'</label><input class="in-'+k+'" type="number" min="0" inputmode="decimal" value="'+r1(i[k])+'"></div>').join('')+'</div>'
   +'<div class="note it-t">= '+Math.round(i.k*i.q)+' kcal · P '+Math.round(i.p*i.q)+' · C '+Math.round(i.c*i.q)+' · F '+Math.round(i.f*i.q)+'</div></div>').join('');
}
function recalc(){
  const t={kcal:0,p:0,c:0,f:0};
  SH.items.forEach(i=>{t.kcal+=i.k*i.q;t.p+=i.p*i.q;t.c+=i.c*i.q;t.f+=i.f*i.q});
  SH.v={kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f)};
  ['kcal','p','c','f'].forEach(k=>{const e=$('#f-'+k);if(e)e.value=SH.v[k]});
  document.querySelectorAll('.it').forEach(el=>{const i=SH.items[+el.dataset.i],s=el.querySelector('.it-t');if(i&&s)s.textContent='= '+Math.round(i.k*i.q)+' kcal · P '+Math.round(i.p*i.q)+' · C '+Math.round(i.c*i.q)+' · F '+Math.round(i.f*i.q)});
}
function syncSH(){const n=$('#f-name'),t=$('#f-type'),x=$('#f-txt');if(n)SH.name=n.value;if(t)SH.type=t.value;if(x)SH.txt=x.value}
function addItem(v){
  if(!v||!SH)return;syncSH();
  if(!SH.items){
    SH.items=[];const g=k=>Math.round(+($('#f-'+k)||{}).value||0);
    if(g('kcal')+g('p')+g('c')+g('f')>0)SH.items.push({n:'Earlier total',u:'as entered',q:1,k:g('kcal'),p:g('p'),c:g('c'),f:g('f')});
  }
  if(v==='custom')SH.items.push({n:'',u:'1 serving',q:1,k:0,p:0,c:0,f:0});
  else{const f=FOODS[+v];SH.items.push({n:f[1],u:f[2],q:1,k:f[3],p:f[4],c:f[5],f:f[6]})}
  recalc();sheet();const L=document.querySelectorAll('.it');if(L.length&&L[L.length-1].scrollIntoView)L[L.length-1].scrollIntoView({block:'nearest'});
}

/* ---------- haptics + sounds ---------- */
function setMult(m){SH.mult=m;setVals(m);$('#f-mult').value=m;document.querySelectorAll('.chips button[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m===m))}
const hapEl=SAFE?null:(()=>{const l=document.createElement('label');l.setAttribute('aria-hidden','true');l.style.cssText='position:fixed;left:-80px;top:0;width:40px;height:40px;opacity:.01;pointer-events:none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.appendChild(i);document.body.appendChild(l);return l})();
function haptic(n){
  if(SAFE||!hapEl||ls('plate-hap')==='off')return;
  try{if(navigator.vibrate&&!/iPhone|iPad/.test(navigator.userAgent)){navigator.vibrate(n>1?[12,50,12]:10);return}
    for(let i=0;i<n;i++){if(i===0)hapEl.click();else setTimeout(()=>hapEl.click(),i*90)}}catch(e){}
}
let AC=null;
const AUD=new Audio(),wavCache={};
function wavUrl(fr,dur,vol){
  const sr=22050,step=Math.floor(sr*dur*.8),n=step*(fr.length-1)+Math.floor(sr*dur*1.3),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const k=Math.min(fr.length-1,Math.floor(i/step)),t=(i-k*step)/sr,f=fr[k],env=Math.min(1,t*300)*Math.exp(-t*(5/dur));
    const x=(Math.sin(2*Math.PI*f*t)+.35*Math.sin(4*Math.PI*f*t))*env*vol*32767/1.35;v.setInt16(44+i*2,Math.max(-32767,Math.min(32767,x)),true)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function playWav(fr,dur,vol){
  const key=fr.join('-')+'|'+dur+'|'+vol,url=wavCache[key]||(wavCache[key]=wavUrl(fr,dur,vol));
  AUD.src=url;const p=AUD.play();return p&&p.then?p:Promise.resolve();
}
function beep(fr,dur,vol){
  try{playWav(fr,dur,Math.min(.8,vol*6)).catch(()=>beepWA(fr,dur,vol*3))}catch(e){beepWA(fr,dur,vol*3)}
}
function beepWA(fr,dur,vol){
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=AC||new A();if(AC.state==='suspended')AC.resume();
    let t=AC.currentTime;fr.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8})}catch(e){}
}
function unlockAudio(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}if(!AUD._u){AUD._u=1;try{playWav([1],.05,0).catch(()=>{})}catch(e){}}try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=AC||new A();if(AC.state!=='running')AC.resume();const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}catch(e){}}
function tap(){haptic(1);unlockAudio()}
function fb(k){
  haptic(k==='ok'||k==='done'?2:1);
  if(ls('plate-snd')==='off')return;
  const s={ok:[[659,880],.11,.07],done:[[784,1047],.1,.06],del:[[440,330],.09,.06],err:[[220,180],.14,.07],note:[[880],.12,.05]}[k];if(s)beep(s[0],s[1],s[2]);
}
document.addEventListener('change',e=>{
  if(e.target.id==='f-pick')addItem(e.target.value);
  if(e.target.id==='g-h'){ls('plate-hap',e.target.checked?'on':'off');if(e.target.checked)haptic(2)}
  if(e.target.id==='g-s'){ls('plate-snd',e.target.checked?'on':'off');if(e.target.checked)beep([659,880],.11,.07)}
});
document.addEventListener('input',e=>{
  const t=e.target,row=t.closest&&t.closest('.it');
  if(row&&SH&&SH.items){const it=SH.items[+row.dataset.i];if(it){const c=t.classList;
    if(c.contains('in-n'))it.n=t.value;else if(c.contains('in-u'))it.u=t.value;
    else{const x=Math.max(0,parseFloat(t.value)||0);if(c.contains('in-q'))it.q=x;else if(c.contains('in-k'))it.k=x;else if(c.contains('in-p'))it.p=x;else if(c.contains('in-c'))it.c=x;else if(c.contains('in-f'))it.f=x;recalc()}}return}
  if(e.target.id==='f-mult'&&SH&&SH.base){const m=parseFloat(e.target.value);if(m>0&&m<=20){SH.mult=m;setVals(m);document.querySelectorAll('.chips button[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m===m))}}
});

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(a!=='scrim')tap();
  if(a==='scrim'){if(e.target===el){SH=null;sheet()}return}
  if(a==='connect'){
    const url=DEFAULT_URL||$('#s-url').value.trim(),key=$('#s-key').value,who=$('#s-me').value.trim();
    if(!/^https:\/\//.test(url)||!key||!who)return toast('Fill in all three fields');
    el.disabled=true;el.innerHTML='<span class="spin"></span>Connecting…';cfg={url,key,me:who};try{await api('ping');ls('plate',JSON.stringify(cfg));keepLink();S.ready=false;render();load()}catch(x){el.disabled=false;el.textContent='Connect';cfg=null;toast(x.message==='Failed to fetch'?'Can’t reach that URL':x.message)}return;
  }
  if(a==='retry'){S.err='';render();load()}
  else if(a==='reset'){if(confirm('Sign out of this device?')){ls('plate','');ls('plate-cache','');cfg=null;S.ready=false;SH=null;$('#layer').innerHTML='';render()}}
  else if(a==='tab'){S.tab=el.dataset.t;render(1)}
  else if(a==='view'){S.view=el.dataset.id;render(1)}
  else if(a==='prev'){S.day=addD(S.day,-1);render(1)}
  else if(a==='next'&&S.day<TODAY){S.day=addD(S.day,1);render(1)}
  else if(a==='mode'){S.mode=el.dataset.m;S.anchor=S.mode==='custom'?S.anchor:TODAY;render(1)}
  else if(a==='sh'){shift(+el.dataset.n);render(1)}
  else if(a==='csv')csv();
  else if(a==='snap'){S.view=me();$('#file').value='';$('#file').click()}
  else if(a==='manual'){SH={manual:1,thumb:'',name:'',type:mtype(),v:{},base:null,mult:1,ai:null,loading:false,err:''};sheet()}
  else if(a==='recent'){const m=Object.values(S.meals.filter(x=>x.who===me()).sort((x,y)=>y.ts-x.ts).reduce((o,x)=>{const k=x.name.toLowerCase();if(!o[k])o[k]=x;return o},{})).slice(0,6)[+el.dataset.i];SH.name=m.name;SH.type=m.type;SH.v={kcal:m.kcal,p:m.p,c:m.c,f:m.f};SH.base={kcal:m.kcal,p:m.p,c:m.c,f:m.f};SH.mult=1;SH.ai=null;SH.items=parseItems(m.items);sheet()}
  else if(a==='edit'){const m=S.meals.find(x=>x.id===el.dataset.id);if(!m)return;const b={kcal:m.kcal,p:m.p,c:m.c,f:m.f};SH={editId:m.id,thumb:m.thumb||'',name:m.name,type:m.type,v:Object.assign({},b),base:b,mult:1,ai:null,loading:false,err:'',items:parseItems(m.items),hadItems:!!m.items};sheet()}
  else if(a==='metric'){S.metric=el.dataset.m;render(1)}
  else if(a==='sum'){
    const{w,f,t,l}=el.dataset,k=sumKey(w,f,t);S.sums[k]={loading:1};render();
    try{const j=await api('sum',{label:l,stats:sumPayload(w,f,t,l)});S.sums[k]=j.result;
      const keep={};Object.keys(S.sums).filter(z=>S.sums[z].summary).slice(-20).forEach(z=>keep[z]=S.sums[z]);ls('plate-sum',JSON.stringify(keep))}
    catch(x){S.sums[k]={err:(x.message==='Failed to fetch'?'Can’t reach the backend.':x.message)+' Please try again.'}}
    render();
  }
  else if(a==='estimate')estimate();
  else if(a==='cancel'){SH=null;sheet()}
  else if(a==='mult')setMult(+el.dataset.m);
  else if(a==='itq'){const it=SH.items[+el.dataset.i];it.q=Math.max(0,Math.round((it.q+ +el.dataset.d)*100)/100);el.closest('.it').querySelector('.in-q').value=it.q;recalc()}
  else if(a==='itdel'){syncSH();SH.items.splice(+el.dataset.i,1);if(SH.items.length)recalc();else{SH.items=null;SH.v={}}sheet()}
  else if(a==='mstep')setMult(Math.max(.1,Math.round((SH.mult+ +el.dataset.d)*100)/100));
  else if(a==='save')save();
  else if(a==='goals')goalsSheet();
  else if(a==='testh'){const v=(navigator.userAgent.match(/OS (\d+)[_.](\d+)/)||[]);try{hapEl.click();setTimeout(()=>hapEl.click(),150)}catch(x){}
    $('#fbnote').textContent='Vibration test sent · iOS '+(v[1]?v[1]+'.'+v[2]:'unknown')+' · '+(navigator.standalone?'Home Screen app':'Safari tab')+'. Did you feel a tap? If not: check Settings → Sounds & Haptics → System Haptics is on. If it is, your iPhone doesn’t let web pages trigger haptics, and this can’t be fixed from inside the app.'}
  else if(a==='tests'){unlockAudio();let r='plays OK';try{await playWav([659,880],.2,.6)}catch(x){r='was blocked ('+((x&&x.name)||'error')+')'}
    $('#fbnote').textContent='Sound '+r+' · silent-mode override: '+(navigator.audioSession?'available':'not available')+'. Did you hear two notes? If not, press the volume-up button on the side while the app is open (this controls media volume), and check the “Sounds” box above is ticked.'}
  else if(a==='clearcache'){ls('plate-cache','');ls('plate-sum','');try{sessionStorage.setItem('plate-boot','0')}catch(x){}location.reload()}
  else if(a==='diag'){
    const out=[],box=$('#diag');box.innerHTML='<div class="ai"><span class="spin"></span>Checking…</div>';
    const step=async(n,fn)=>{const t=Date.now();try{await fn();out.push('✅ '+n+' ('+((Date.now()-t)/1000).toFixed(1)+'s)')}catch(e){out.push('❌ '+n+': '+e.message)}box.innerHTML='<div class="ai" style="color:var(--ink)">'+out.map(esc).join('<br>')+'</div>'};
    await step('Backend reachable',()=>api('ping'));
    await step('Meals load',()=>api('list',{who:me(),since:addD(TODAY,-7),thumbSince:TODAY}));
    await step('AI answers',()=>api('ai',{text:'one boiled egg'}));
  }
  else if(a==='invite'){const link=location.origin+location.pathname+'#u='+encodeURIComponent(cfg.url)+'&k='+encodeURIComponent(cfg.key);
    if(navigator.share)navigator.share({title:'Plate',text:'Open this link to join our Plate tracker, then enter your name:',url:link}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(link).then(()=>toast('Link copied'))}
  else if(a==='savegoals'){
    const g={who:me(),goalKcal:Math.max(800,Math.round(+$('#g-k').value||2000)),goalP:Math.max(20,Math.round(+$('#g-p').value||100)),email:$('#g-e').value.trim()};
    if(g.email&&g.email.indexOf('@')<1)return toast('That email doesn’t look right');
    try{await api('goals',g);S.people[me()]=g;$('#layer').innerHTML='';render();toast('Goals updated')}catch(x){toast('Couldn’t save goals')}
  }
  else if(a==='del'){if(confirm('Delete this meal?'))try{el.closest('.meal').style.opacity=.4;await api('del',{id:el.dataset.id,who:me()});S.meals=S.meals.filter(m=>m.id!==el.dataset.id);render();fb('del')}catch(x){el.closest('.meal').style.opacity=1;toast('Couldn’t delete')}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='c-f'||e.target.id==='c-t'){const f=$('#c-f').value,t=$('#c-t').value;if(f&&t&&f<=t){S.from=f;S.to=t;render()}}
});
$('#file').addEventListener('change',e=>onFile(e.target.files[0]));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg)load()});
setInterval(()=>{if(cfg&&!document.hidden&&!SAFE)load(true)},60000);
render();if(SAFE)toast('Safe mode: the page crashed earlier, so animations and saved copies are switched off.');if(cfg)load();
